<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="logoMarkTitle">
  <title id="logoMarkTitle">PixelCraft UI Logo Mark</title>
  <!-- Rounded square container (22% radius) -->
  <rect width="64" height="64" rx="14" fill="#6C5CE7" />
  <!-- 3x3 pixel grid forming letter 'P' in 7 white pixels + 1 teal craft accent pixel -->
  <!-- Row 1 -->
  <rect x="10" y="10" width="10" height="10" rx="2.5" fill="#FFFFFF" />
  <rect x="27" y="10" width="10" height="10" rx="2.5" fill="#FFFFFF" />
  <rect x="44" y="10" width="10" height="10" rx="2.5" fill="#FFFFFF" />
  <!-- Row 2 -->
  <rect x="10" y="27" width="10" height="10" rx="2.5" fill="#FFFFFF" />
  <rect x="27" y="27" width="10" height="10" rx="2.5" fill="#FFFFFF" />
  <rect x="44" y="27" width="10" height="10" rx="2.5" fill="#FFFFFF" />
  <!-- Row 3: P stem bottom (white) + Craft accent (teal) -->
  <rect x="10" y="44" width="10" height="10" rx="2.5" fill="#FFFFFF" />
  <rect x="44" y="44" width="10" height="10" rx="2.5" fill="#16B8A6" />
</svg>
