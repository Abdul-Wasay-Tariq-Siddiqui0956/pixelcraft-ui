<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="ogCoverTitle">
  <title id="ogCoverTitle">PixelCraft UI — Social Share Cover</title>
  <defs>
    <!-- Subtle pixel-grid pattern -->
    <pattern id="pixelGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <circle cx="20" cy="20" r="1.5" fill="#242E4C" />
    </pattern>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C5CE7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#16B8A6" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#151827" />
  <rect width="1200" height="630" fill="url(#pixelGrid)" />
  <circle cx="300" cy="200" r="350" fill="url(#glowGrad)" />

  <!-- Logo Mark (120x120) -->
  <g transform="translate(100, 100)">
    <rect width="120" height="120" rx="26" fill="#6C5CE7" />
    <!-- Row 1 -->
    <rect x="19" y="19" width="19" height="19" rx="5" fill="#FFFFFF" />
    <rect x="50.5" y="19" width="19" height="19" rx="5" fill="#FFFFFF" />
    <rect x="82" y="19" width="19" height="19" rx="5" fill="#FFFFFF" />
    <!-- Row 2 -->
    <rect x="19" y="50.5" width="19" height="19" rx="5" fill="#FFFFFF" />
    <rect x="50.5" y="50.5" width="19" height="19" rx="5" fill="#FFFFFF" />
    <rect x="82" y="50.5" width="19" height="19" rx="5" fill="#FFFFFF" />
    <!-- Row 3 -->
    <rect x="19" y="82" width="19" height="19" rx="5" fill="#FFFFFF" />
    <rect x="82" y="82" width="19" height="19" rx="5" fill="#16B8A6" />
  </g>

  <!-- Wordmark -->
  <text x="250" y="180" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="700" letter-spacing="-0.03em" fill="#F7F8FC">PixelCraft</text>
  <text x="590" y="180" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="64" font-weight="500" letter-spacing="-0.03em" fill="#A89BFA">UI</text>

  <!-- Tagline Badge -->
  <g transform="translate(100, 260)">
    <rect width="430" height="44" rx="8" fill="#242E4C" />
    <text x="20" y="28" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="600" fill="#16B8A6" letter-spacing="0.04em">BEAUTIFUL COMPONENTS. PURE HTML &amp; CSS.</text>
  </g>

  <!-- Main Pitch Statement -->
  <text x="100" y="370" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="-0.02em">
    The Modern 15-Page Component Library
  </text>
  <text x="100" y="425" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="700" fill="#A89BFA" letter-spacing="-0.02em">
    Crafted for Students &amp; Web Designers
  </text>

  <text x="100" y="490" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">
    Zero JavaScript • Semantic HTML5 • Accessible CSS3 • Fully Responsive
  </text>

  <!-- Bottom Details Bar -->
  <line x1="100" y1="535" x2="1100" y2="535" stroke="#242E4C" stroke-width="2" />
  <text x="100" y="575" font-family="'Inter', -apple-system, sans-serif" font-size="18" font-weight="500" fill="#626B7A">
    Free educational design system &amp; reference guide
  </text>
  <text x="1100" y="575" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="500" fill="#6C5CE7">
    pixelcraft-ui.local
  </text>
</svg>
