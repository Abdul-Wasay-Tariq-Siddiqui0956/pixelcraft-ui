<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 44" width="220" height="44" role="img" aria-labelledby="logoLightTitle">
  <title id="logoLightTitle">PixelCraft UI Logo</title>
  <!-- Symbol (40x40) -->
  <g transform="translate(2, 2)">
    <rect width="40" height="40" rx="9" fill="#6C5CE7" />
    <rect x="6.5" y="6.5" width="6.5" height="6.5" rx="1.6" fill="#FFFFFF" />
    <rect x="16.75" y="6.5" width="6.5" height="6.5" rx="1.6" fill="#FFFFFF" />
    <rect x="27" y="6.5" width="6.5" height="6.5" rx="1.6" fill="#FFFFFF" />
    <rect x="6.5" y="16.75" width="6.5" height="6.5" rx="1.6" fill="#FFFFFF" />
    <rect x="16.75" y="16.75" width="6.5" height="6.5" rx="1.6" fill="#FFFFFF" />
    <rect x="27" y="16.75" width="6.5" height="6.5" rx="1.6" fill="#FFFFFF" />
    <rect x="6.5" y="27" width="6.5" height="6.5" rx="1.6" fill="#FFFFFF" />
    <rect x="27" y="27" width="6.5" height="6.5" rx="1.6" fill="#16B8A6" />
  </g>
  <!-- Wordmark for Light Surfaces (Always high-contrast dark charcoal #0F172A) -->
  <text x="52" y="29" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.02em" fill="#0F172A">PixelCraft</text>
  <text x="164" y="29" font-family="'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.02em" fill="#6C5CE7">UI</text>
</svg>
